<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MX IP STUDIO｜Skill Runner 引導式產出</title>
<style>
  :root { --bg:#0d0d0f; --panel:#161618; --panel2:#1c1c20; --line:#2a2a30;
          --gold:#c5a46b; --txt:#e8e6e0; --dim:#a3a097; --ok:#5ba89e; --warn:#f2b35e; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { font-family:'Noto Sans TC',system-ui,sans-serif; background:var(--bg); color:var(--txt);
         margin:0; display:flex; flex-direction:column; }
  .breadcrumb { display:flex; align-items:center; gap:10px; padding:10px 28px; font-size:12px; letter-spacing:.05em; border-bottom:1px solid var(--line); background:rgba(0,0,0,.25); font-weight:700; flex:0 0 auto; }
  .breadcrumb a { color:var(--gold); text-decoration:none; }
  .breadcrumb a:hover { opacity:.7; }
  .breadcrumb .sep { color:#5a6270; font-size:14px; }
  .breadcrumb .current { color:var(--dim); }
  header { padding:16px 28px 12px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  h1 { font-size:19px; letter-spacing:.06em; margin:0 0 2px; }
  h1 span { color:var(--gold); }
  .sub { color:var(--dim); font-size:12px; }
  .banner { background:rgba(242,179,94,.12); border:1px solid rgba(242,179,94,.4); color:var(--warn);
            font-size:12px; padding:8px 12px; border-radius:8px; margin:10px 28px 0; }
  .banner.hidden { display:none; }

  .picker { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; padding:12px 28px 0; flex:0 0 auto; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:var(--dim); letter-spacing:.04em; }
  select { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px;
           padding:8px 11px; font:14px/1.4 inherit; outline:none; min-width:200px; }
  select:focus { border-color:var(--gold); }
  button { cursor:pointer; border:1px solid var(--line); border-radius:9px; padding:9px 15px; font:13px/1 inherit;
           background:var(--panel2); color:var(--txt); white-space:nowrap; }
  button:hover { border-color:var(--gold); }
  button.primary { background:var(--gold); color:#1a1408; border-color:var(--gold); font-weight:700; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .pill { display:inline-block; font-size:10px; padding:1px 7px; border-radius:3px; font-family:monospace;
          letter-spacing:.04em; margin-left:6px; background:rgba(197,164,107,.15); color:var(--gold); }

  /* 首頁：總進度 + 角色磚塊 */
  .home { padding:14px 28px 28px; overflow:auto; flex:1 1 auto; min-height:0; }
  .home-top { display:flex; gap:12px; align-items:stretch; margin-bottom:18px; flex-wrap:wrap; }
  .pbar-wrap { background:linear-gradient(140deg,#1a1a1d,var(--panel2)); border:1px solid var(--line); border-top:3px solid var(--ok); border-radius:18px; padding:16px 20px; flex:1; min-width:280px; }
  .pbar-top { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:9px; color:var(--dim); }
  .pbar-top b { color:var(--ok); font-size:27px; font-weight:800; line-height:1; letter-spacing:-.01em; }
  .pbar { height:10px; background:#0e0e10; border-radius:6px; overflow:hidden; }
  .pbar > i { display:block; height:100%; background:var(--ok); transition:width .3s; }
  /* C：我的待辦面板 */
  .todos { border:1px solid var(--gold); border-radius:12px; background:rgba(197,164,107,.07); padding:12px 15px; margin-bottom:14px; }
  .todos-h { font-size:13.5px; font-weight:800; color:var(--gold); margin-bottom:8px; }
  .todos-sub { font-size:11px; font-weight:400; color:var(--dim); margin-left:8px; }
  .todo { display:flex; align-items:center; gap:9px; padding:7px 6px; border-top:1px solid var(--line); cursor:pointer; font-size:13.5px; }
  .todo:first-of-type { border-top:none; }
  .todo input { width:16px; height:16px; accent-color:var(--gold); cursor:pointer; flex:0 0 auto; }
  .todo .tpri { flex:0 0 auto; font-size:12px; }
  .todo .titem { flex:1; line-height:1.45; }
  .todo .tdue { flex:0 0 auto; font-size:11px; color:var(--dim); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:1px 7px; }
  .todo-doing { opacity:.6; }
  .todo-done .titem { text-decoration:line-through; color:var(--dim); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; }
  .tile { border:1px solid var(--line); border-top:3px solid var(--line); border-radius:18px; background:var(--panel); padding:16px 18px;
          cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s; display:flex; flex-direction:column; }
  .tile:hover { border-color:var(--gold); border-top-color:var(--gold); transform:scale(1.02); box-shadow:0 12px 34px rgba(0,0,0,.4); }
  .tile .rn { font-size:10px; font-family:monospace; color:var(--dim); letter-spacing:.03em; }
  .tile .rname { font-size:15px; font-weight:700; margin:3px 0 7px; }
  .tile .rscope { font-size:11.5px; color:var(--dim); line-height:1.55; flex:1;
                  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .tbar { height:5px; background:#0e0e10; border-radius:4px; overflow:hidden; margin:11px 0 0; }
  .tile .tbar > i { display:block; height:100%; background:var(--ok); transition:width .3s; }
  .tile .tstat { margin-top:8px; display:flex; gap:8px; align-items:center; }
  /* 總覽＝選流程＋開工二合一：磚塊上的參與/退出控制 */
  .home-hint { font-size:12.5px; color:var(--dim); line-height:1.6; margin:2px 0 12px; }
  .tile-act { margin-top:11px; display:flex; align-items:center; gap:10px; }
  .tile-go { font-size:11.5px; color:var(--gold); font-weight:700; }
  .t-join { background:var(--gold); color:#1a1408; border:none; border-radius:8px; font-weight:800; padding:9px 13px; font-size:13px; white-space:nowrap; }
  .t-leave { margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:7px; padding:6px 11px; font-size:11.5px; }
  .t-leave:hover { border-color:#ff8b73; color:#ffd8cf; }
  .tile.unjoined { cursor:default; }
  .tile.unjoined:hover { transform:none; border-color:var(--line); border-top-color:var(--line); box-shadow:none; }
  .tile.unjoined .tbar { display:none; }
  .home-foot { margin:14px 2px 4px; }
  .home-foot a { color:var(--dim); font-size:12px; text-decoration:none; }
  .home-foot a:hover { color:var(--gold); }
  .pstat { display:inline-block; font-size:11px; padding:2px 10px; border-radius:20px; }
  .s-todo{ background:rgba(122,120,112,.18); color:var(--dim); }
  .s-doing{ background:rgba(141,211,255,.16); color:#8dd3ff; }
  .s-review{ background:rgba(242,179,94,.16); color:var(--warn); }
  .s-done{ background:rgba(113,209,194,.18); color:var(--ok); }
  .wk { color:var(--ok); font-weight:700; font-size:11px; }
  /* 未參與的流程：壓暗、不可點（依個人選了幾個流程，其餘自動壓暗） */
  .tile.dim { opacity:.4; filter:saturate(.45); cursor:default; }
  .tile.dim:hover { border-color:var(--line); border-top-color:var(--line); transform:none; box-shadow:none; }
  .s-locked { background:rgba(122,120,112,.14); color:var(--dim); }
  .digest { display:flex; flex-direction:column; gap:10px; max-width:960px; }
  .dcard { border:1px solid var(--line); border-radius:10px; background:var(--panel); overflow:hidden; }
  .dhead { display:flex; align-items:center; gap:8px; padding:11px 14px; cursor:pointer; font-size:14px; }
  .dhead:hover { background:var(--panel2); }
  .dwk { color:var(--ok); font-size:11px; font-weight:700; width:46px; flex:0 0 auto; }
  .dtoggle { color:var(--dim); margin-left:6px; }
  .dbody { padding:8px 16px 14px; border-top:1px solid var(--line); font-size:13px; line-height:1.7; max-height:420px; overflow:auto; }
  .dmsg { padding:6px 0; white-space:pre-wrap; word-break:break-word; }
  .dmsg.ai b { color:var(--gold); } .dmsg.user b { color:var(--ok); }
  .gday { margin-bottom:20px; }
  .gday h3 { font-size:13px; color:var(--gold); margin:0 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .gday h3 span { color:var(--dim); font-weight:400; font-size:11px; }
  .gimgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .gitem img { width:100%; height:140px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:pointer; display:block; }
  .gitem img:hover { border-color:var(--gold); }
  .gcap { font-size:10px; color:var(--dim); margin-top:4px; line-height:1.35; }

  /* 進度細表（admin）*/
  .ptable { width:100%; border-collapse:collapse; font-size:13px; max-width:880px; }
  .ptable th, .ptable td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  .ptable th { color:var(--dim); font-weight:600; font-size:11px; }

  /* 對談 */
  .chat-head { display:flex; gap:10px; align-items:center; padding:12px 28px 0; flex:0 0 auto; flex-wrap:wrap; }
  /* 麵包屑：回我選定的流程 › 目前流程（主從關係一行表示，省空間） */
  .crumb-back { background:#f8d66d; color:#111318; border:none; font-weight:800; border-radius:8px; padding:7px 12px; font-size:13px; white-space:nowrap; }
  .crumb-sep { color:#5a6270; font-weight:900; font-size:15px; }
  .chat-role { font-size:14px; color:var(--dim); }
  .chat-role b { color:var(--txt); }
  .chat-prog { margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--dim); }
  .chat-prog .cbar { width:130px; height:6px; background:#0e0e10; border-radius:4px; overflow:hidden; }
  .chat-prog .cbar > i { display:block; height:100%; background:var(--ok); transition:width .3s; }
  .runner { display:grid; grid-template-columns:230px 1fr 320px; gap:18px; padding:12px 28px 0; flex:1 1 auto; min-height:0; }
  .refpanel { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px; overflow:auto; }
  .refpanel .ref-h { font-size:12px; color:var(--dim); margin:0 2px 8px; font-weight:600; }
  .home-gallery { margin-top:22px; }
  .home-gallery .ref-h { font-size:13px; color:var(--gold); font-weight:700; margin:0 0 12px; }
  .wktabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .wktab { cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:999px; padding:5px 11px; font:12px/1 inherit; }
  .wktab:hover { border-color:var(--gold); }
  .wktab.on { border-color:var(--gold); color:var(--gold); }
  .refgrid { grid-template-columns:repeat(auto-fill,minmax(118px,1fr)) !important; }
  .refgrid .gitem img { height:96px; }
  .guide { border:1px solid var(--line); border-radius:10px; background:var(--panel); padding:10px; overflow:auto; }
  .guide h3 { font-size:12px; color:var(--dim); margin:2px 6px 8px; letter-spacing:.05em; font-weight:600; }
  .guide .focus { font-size:11px; color:var(--ok); margin:0 6px 10px; line-height:1.6; }
  /* 既有角色重點提示卡（釘在對話最上方，從 roster 直接列出 A/B/C/D…，不靠 AI 自述） */
  .roster-card { flex:0 0 auto; border:1px solid rgba(197,164,107,.45); background:rgba(197,164,107,.07); border-radius:10px; padding:10px 12px; margin:0 0 10px; }
  .roster-card .rc-h { font-size:12.5px; font-weight:900; color:var(--gold); margin-bottom:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
  .roster-card .rc-sub { font-size:11px; font-weight:600; color:var(--dim); }
  .roster-card .rc-list { display:grid; gap:6px; }
  .roster-card .rc-item { font-size:12.5px; line-height:1.5; color:#e8e6e0; }
  .roster-card .rc-letter { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:5px; background:var(--gold); color:#111318; font-weight:900; font-size:11px; margin-right:7px; vertical-align:middle; }
  .roster-card .rc-dna { color:var(--dim); margin-left:6px; }
  /* 本週優化重點卡（依會議結論，每週更新）；放在角色卡上方，顏色用青綠系區隔 */
  .premise-card { flex:0 0 auto; border:1px solid rgba(91,168,158,.5); background:rgba(91,168,158,.09); border-radius:10px; padding:10px 12px; margin:0 0 10px; }
  .premise-card .pc-h { font-size:12.5px; font-weight:900; color:var(--ok); margin-bottom:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; }
  .premise-card .pc-sub { font-size:11px; font-weight:600; color:var(--dim); }
  .premise-card .pc-row { font-size:12.5px; line-height:1.55; color:#e8e6e0; margin:3px 0; }
  .premise-card .pc-k { display:inline-block; font-size:10.5px; font-weight:900; color:#0d0d0f; background:var(--ok); border-radius:5px; padding:1px 7px; margin-right:7px; }
  .premise-card .pc-issue .pc-k { background:var(--warn); }
  /* 新一週優化開始的分隔訊息 */
  .weekdiv { align-self:center; max-width:90%; text-align:center; white-space:pre-wrap; font-size:12px; line-height:1.6; color:var(--ok); font-weight:700; background:rgba(91,168,158,.1); border:1px dashed rgba(91,168,158,.5); border-radius:10px; padding:9px 14px; margin:6px 0; }
  .covbox { border:1px solid var(--line); border-radius:8px; background:var(--panel2); padding:9px 10px; margin:0 0 10px; }
  .covbox h3 { font-size:11px; color:var(--ok); margin:0 0 7px; letter-spacing:.03em; font-weight:600; }
  .covrow { font-size:12px; color:var(--dim); padding:3px 0; line-height:1.45; }
  .gstep { display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-radius:7px; font-size:12.5px; color:var(--dim); }
  .gstep .n { width:18px; height:18px; border-radius:50%; border:1px solid var(--line); flex:0 0 auto;
              display:flex; align-items:center; justify-content:center; font-size:10px; }
  .gstep .cmd { font-family:monospace; font-size:10px; opacity:.55; }
  .chat { display:flex; flex-direction:column; min-height:0; }
  .msgs { flex:1 1 auto; overflow:auto; padding:6px 4px; display:flex; flex-direction:column; gap:12px; }
  /* Threads 式全寬好讀：不用對話外框，整則完整顯示、行距寬、用「名字標籤＋分隔線」分辨誰說的（不靠窄泡泡）。 */
  .msg { align-self:stretch; max-width:100%; padding:8px 4px 14px; border:none; border-radius:0; font-size:15px; line-height:1.9; white-space:pre-wrap; word-break:break-word; border-bottom:1px solid rgba(255,255,255,.07); }
  .msg .who { font-size:12.5px; font-weight:800; margin-bottom:6px; letter-spacing:.02em; }
  .msg.ai { background:transparent; }
  .msg.ai .who { color:var(--gold); }                                  /* AI 顧問＝金色標籤 */
  /* 你的訊息＝Line 式靠右綠色泡泡，一眼分辨誰在發話（AI 全寬白字＋金標／你＝右側綠泡） */
  .msg.user { align-self:flex-end; max-width:82%; background:rgba(74,222,128,.14); border:1px solid rgba(74,222,128,.4); border-radius:14px; border-top-right-radius:4px; padding:10px 14px; }
  .msg.user .who { color:#86efac; }                                    /* 你＝綠色標籤 */
  .msg strong { color:var(--gold); }
  .typing { align-self:flex-start; color:var(--dim); font-size:13px; padding:6px 4px; }
  .composer { flex:0 0 auto; display:flex; gap:8px; align-items:stretch; padding:10px 0 4px; }   /* 三者等高切齊（桌機/手機一致） */
  /* 輸入框＝你的，框線用與「你的綠泡泡」一致的綠（UI 語彙：綠＝你）；送出也綠 */
  /* 注意：font shorthand 不能用 inherit 當 family（整條會被瀏覽器丟棄→吃 textarea 預設小字）。用 longhand。 */
  .composer textarea { flex:1; background:var(--panel2); color:var(--txt); border:1px solid rgba(74,222,128,.45); border-radius:10px;
    padding:13px 15px; font-family:inherit; font-size:15px; line-height:1.6; outline:none; resize:none; min-height:50px; max-height:170px; }
  .composer textarea:focus { border-color:#4ade80; box-shadow:0 0 0 2px rgba(74,222,128,.18); }
  #sendBtn { background:#4ade80; color:#0d2417; border-color:#4ade80; font-weight:800; }
  #sendBtn:hover { background:#5eea90; border-color:#5eea90; }
  /* ＋ 功能鍵與手機功能選單（桌機隱藏，用既有 toolbar） */
  .more-btn{ display:none; }
  .msheet{ display:none; }
  .msheet[hidden]{ display:none; }
  .attach-btn { cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:0 14px; background:var(--panel2); font-size:17px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .attach-btn:hover { border-color:var(--gold); }
  .attach-row { display:flex; gap:8px; flex-wrap:wrap; padding:4px 0 0; }
  .thumb { position:relative; }
  .thumb img { width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; padding:0; border-radius:50%; background:#5a3340; color:#fcc; border:0; font-size:12px; line-height:1; }
  .bimgs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .bimgs img { max-width:180px; max-height:180px; border-radius:8px; border:1px solid var(--line); }
  .doc-chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:5px 9px; border-radius:7px; background:var(--panel); border:1px solid var(--line); color:var(--txt); }
  .doc-chip button { border:0; background:none; color:#fcc; cursor:pointer; padding:0 0 0 4px; font-size:12px; }
  .bdocs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .lightbox { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
  .lightbox.on { display:flex; }
  .lightbox img { max-width:96%; max-height:96%; border-radius:8px; box-shadow:0 20px 70px rgba(0,0,0,.6); }
  .gitem img, .bimgs img { cursor:zoom-in; }
  .toolbar { flex:0 0 auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-top:1px solid var(--line); padding:10px 0; margin-bottom:6px; }
  .savestate { font-size:11px; color:var(--dim); margin-left:auto; }
  .empty { color:var(--dim); font-size:14px; padding:48px 20px; text-align:center; line-height:1.9; }
  .empty a { color:var(--gold); }
  @media (max-width:1200px){ .runner{ grid-template-columns:230px 1fr; } .refpanel{ display:none; } }
  @media (max-width:820px){
    /* 不讓任何元素撐出畫面寬度（橫向溢出會讓整頁被壓縮→字看起來小、聚焦又被放大） */
    html, body{ overflow-x:hidden; }
    /* 省上方空間 */
    .breadcrumb{ padding:10px 14px; font-size:13px; } header{ padding:12px 14px 8px; } .sub{ display:none; }
    h1{ font-size:20px; }
    /* IP 下拉：正常單行高度（移除會讓 select 在直欄 .field 內縱向長高的 flex），字尾原生 ▾ */
    .picker{ padding:10px 14px 0; gap:8px; align-items:center; } .field{ flex:1 1 auto; min-width:0; }
    select{ min-width:0; width:100%; font-size:16px; padding:10px 12px; height:auto; }
    /* 在流程對話頁，隱藏上方標題/麵包屑/IP選單列（資訊都收進下面那行麵包屑），省高度 */
    body.flow-view .breadcrumb, body.flow-view header, body.flow-view .picker{ display:none; }
    .chat-head{ padding:10px 14px 4px; flex-wrap:wrap; gap:6px 8px; align-items:center; }
    /* 關鍵：改 flex 直欄、讓 .chat 真正吃滿高度 → 對話區(.msgs)內部捲動，送出後新訊息會被帶到眼前
       （原本是 grid，列高=內容，導致整頁長高、新訊息跑到畫面外） */
    .runner{ display:flex; flex-direction:column; padding:10px 12px 0; }
    .guide{ display:none; }
    .chat{ flex:1 1 auto; min-height:0; }
    /* 背景卡限高、可內捲，不再把對話區擠成 0 高 */
    .roster-card, .premise-card{ max-height:22vh; overflow:auto; }
    .msgs{ min-height:0; gap:14px; }
    /* 字級整體放大、好讀（手機拿在手上閱讀距離較近也夠大）；輸入框 16px 配合 maximum-scale 杜絕聚焦放大 */

    /* ＋／輸入框／送出 三者等高、頂底切齊（不再高低不整齊）：composer 改 stretch、移除按鈕固定高 */
    .composer{ gap:7px; align-items:stretch; }
    .composer textarea{ font-size:16px; min-height:50px; max-height:140px; padding:13px 14px; }

    .roster-card .rc-h, .premise-card .pc-h{ font-size:14.5px; }

    .roster-card .rc-sub, .premise-card .pc-sub{ font-size:12.5px; }
    .weekdiv{ font-size:14px; }
    /* 長按鈕在手機可換行、不撐破版面（消除壓縮感與橫向溢出） */
    button{ font-size:15px; white-space:normal; padding:11px 14px; }

    /* ── 手機：整頁式自然捲動（像 Line），不在卡片/對話框裡再放捲軸 ── */
    .chat{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .msgs{ overflow:visible; flex:0 0 auto; }                 /* 不自己捲；跟卡片一起被 .chat 捲動 */
    .roster-card, .premise-card{ max-height:none; overflow:visible; }   /* 卡片不再內捲，手指直接滑頁回看 */
    /* 輸入列釘在底部，永遠看得到 */
    .composer{ position:sticky; bottom:0; z-index:3; background:var(--bg); padding:8px 0 6px; border-top:1px solid var(--line); gap:7px; }

    /* ── ＋ 功能鍵：把不常用的（上傳/匯入/彙整/匯出/重開/狀態）收進來，騰出輸入空間 ── */
    .composer .attach-btn{ display:none; }    /* 收進 ＋ 選單 */
    .toolbar{ display:none; }                  /* 收進 ＋ 選單 */
    .more-btn{ display:inline-flex; align-items:center; justify-content:center; width:50px; min-width:50px; padding:0; font-size:26px; font-weight:300; line-height:1; }
    /* 浮在輸入列上方的功能選單（不擠壓對話、不被 sticky 輸入列蓋住） */
    .msheet:not([hidden]){ display:flex; flex-direction:column; gap:8px; position:fixed; left:10px; right:10px; bottom:74px; z-index:50; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
    .msheet button{ width:100%; text-align:left; font-size:15.5px; padding:13px 14px; }
    .msheet-row{ display:flex; align-items:center; gap:10px; font-size:14px; color:var(--dim); padding:4px 2px; }
    .msheet-row select{ font-size:16px; flex:0 0 auto; min-width:0; }

  }
</style>

<script>
'use strict';
// ── Skill Runner（北極星）：角色磚塊牆 + AI 顧問對談 + 累積式進度 ──
// 首頁＝我選的協作角色磚塊（admin 看全部）+ 總完成度%；點磚塊進該角色 AI 對談。
// 對話存 skill_runs.responses.__chat（skill_id = skill#roleId，每角色一份）。

const CONSULT_SLUG = 'hyper-processor';
const DRIVE_SLUG = 'drive-read';   // ⚠️ 部署後若 Supabase 自動改 slug，改這裡
const SB = (window.MXIPAuth && MXIPAuth.SB_URL) || '';
const CONSULT_URL = SB + '/functions/v1/' + CONSULT_SLUG;
const DRIVE_URL = SB + '/functions/v1/' + DRIVE_SLUG;
const KICKOFF = '請開始。依我這個「指定角色」的職責，用顧問的方式一步步帶我產出我這塊的 deliverable：先用一兩句說明你是我的什麼角色顧問、會怎麼帶我，然後直接問我第一個、最該先決定的問題。一次只問一件事。';
// 開場版本：2＝含既有角色名冊；3＝再含「本週優化命題（上週結論→這週要優化什麼）」。
// 存進 responses.__kickoffV，用來判斷舊存檔的開場要不要自動升級（只升級「還沒實質進度」的對談）。
const KICKOFF_VERSION = 3;
const LBL = { todo:'未開始', doing:'進行中', review:'送審', done:'完成' };

const T = { ip:null, isAdmin:false, view:'home', skill:null, roleId:null, run:null, busy:false, online:true, pending:[], pendingDocs:[], lastDocs:null, roster:null, premise:null, ipImages:null, galWeek:null, nav:0 };

function $(id){ return document.getElementById(id); }
function memberId(){ const e=MXIPAuth.currentEmail(); return e?e.split('@')[0]:null; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
function showBanner(msg){ const b=$('banner'); if(!msg){ b.classList.add('hidden'); return; } b.innerHTML=msg; b.classList.remove('hidden'); }
function pad2(n){ return (n<10?'0':'')+n; }
function roleById(id){ return ROLE_DATA.roles.find(r=>r.id===id); }
function ipName(id){ const m=(typeof IPS!=='undefined'?IPS:[]).find(x=>x.id===id); return m?m.name:id; }

// ── 附圖：圖片縮圖、影片抽關鍵影格（皆在前端轉成 jpeg dataURL）──
function toPayload(d){ const m=/^data:(image\/[a-z]+);base64,(.+)$/.exec(d||''); return m?{media_type:m[1],data:m[2]}:null; }
function scaleCanvas(srcW,srcH){ const max=1280; const sc=Math.min(1,max/Math.max(srcW,srcH)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(srcW*sc)); c.height=Math.max(1,Math.round(srcH*sc)); return c; }
function imageToDataUrl(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ try{ const c=scaleCanvas(img.width,img.height); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85)); }catch(e){ res(null); } }; img.onerror=()=>res(null); img.src=URL.createObjectURL(file); }); }
function extractFrames(file,n){ n=n||4; return new Promise(res=>{ const v=document.createElement('video'); v.preload='metadata'; v.muted=true; v.playsInline=true; v.src=URL.createObjectURL(file); const frames=[]; let times=[],idx=0;
  v.onloadedmetadata=()=>{ const dur=v.duration||0; if(!dur||!isFinite(dur)){ res(frames); return; } for(let i=1;i<=n;i++) times.push(dur*i/(n+1)); seek(); };
  function seek(){ if(idx>=times.length){ try{URL.revokeObjectURL(v.src);}catch(e){} res(frames); return; } v.currentTime=times[idx]; }
  v.onseeked=()=>{ try{ const c=scaleCanvas(v.videoWidth,v.videoHeight); c.getContext('2d').drawImage(v,0,0,c.width,c.height); frames.push(c.toDataURL('image/jpeg',0.82)); }catch(e){} idx++; seek(); };
  v.onerror=()=>res(frames); }); }
function fileToBase64(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const s=String(r.result||''); const i=s.indexOf(','); res(i>=0?s.slice(i+1):''); }; r.onerror=()=>res(''); r.readAsDataURL(file); }); }
async function addFiles(files){
  const list=Array.from(files||[]); if(!list.length) return;
  for(const f of list){
    try{
      if(f.type.indexOf('image/')===0){ const d=await imageToDataUrl(f); if(d) T.pending.push(d); }
      else if(f.type.indexOf('video/')===0){ const fr=await extractFrames(f,4); fr.forEach(d=>{ if(d) T.pending.push(d); }); }
      else if(f.type==='application/pdf'){ if(f.size>30*1024*1024){ alert('PDF 太大（>30MB）：'+f.name+'，請拆小或先擷取重點頁'); continue; } const data=await fileToBase64(f); if(data) T.pendingDocs.push({name:f.name, data:data}); }
    }catch(e){}
  }
  if(T.pending.length>8) T.pending=T.pending.slice(0,8);
  if(T.pendingDocs.length>5) T.pendingDocs=T.pendingDocs.slice(0,5);
  renderChat();
}

function fillIpSelect(){
  const sel=$('ipSel');
  const ips=(typeof IPS!=='undefined'?IPS:[]).slice().sort((a,b)=>(a.order_no||99)-(b.order_no||99));
  sel.innerHTML=ips.map(ip=>'<option value="'+esc(ip.id)+'">'+esc(ip.name)+(ip.status&&ip.status!=='active'?'（'+ip.status+'）':'')+'</option>').join('');
}
async function rolesForIp(ip){
  const id=memberId(); if(!id) return [];
  try{ const r=await fetch(SB+'/rest/v1/role_members?member_id=eq.'+encodeURIComponent(id)+'&ip_id=eq.'+encodeURIComponent(ip)+'&select=role_id',{headers:MXIPAuth.authHeaders()});
    if(r.ok){ T.online=true; return (await r.json()).map(x=>x.role_id); } T.online=false; return []; }catch(e){ T.online=false; return []; }
}
async function myRunsForIp(ip){
  try{ const r=await fetch(SB+'/rest/v1/skill_runs?member_id=eq.'+encodeURIComponent(memberId())+'&ip_id=eq.'+encodeURIComponent(ip)+'&select=skill_id,status,updated_at,coverage:responses->__coverage',{headers:MXIPAuth.authHeaders()});
    if(r.ok){ T.online=true; return await r.json(); } T.online=false; return []; }catch(e){ T.online=false; return []; }
}
// 參與/退出流程（寫 role_members；與舊 roles.html 同一張表、同一把手 repId）→ 把「流程選擇」併進總覽頁。
async function joinFlow(repId){
  const me=memberId(); if(!me) return;
  // 與 roles.html 同：純 POST（join 鈕只在未參與時出現，重複機率低；萬一重複由 RLS/唯一鍵擋、catch 吞掉）。
  try{ await fetch(SB+'/rest/v1/role_members',{ method:'POST', headers:MXIPAuth.authHeaders({'Prefer':'return=minimal'}), body:JSON.stringify({ ip_id:T.ip, role_id:repId, member_id:me }) }); }
  catch(e){ console.warn('join failed',e); }
  await renderHome();
}
async function leaveFlow(repId){
  const me=memberId(); if(!me) return;
  try{ await fetch(SB+'/rest/v1/role_members?ip_id=eq.'+encodeURIComponent(T.ip)+'&role_id=eq.'+repId+'&member_id=eq.'+encodeURIComponent(me),{ method:'DELETE', headers:MXIPAuth.authHeaders({'Prefer':'return=minimal'}) }); }
  catch(e){ console.warn('leave failed',e); }
  await renderHome();
}

// ── 首頁：磚塊牆 ──
async function renderHome(){
  // 離開流程：作廢在途請求(nav++)、清流程脈絡、解除 busy → back/磚塊永遠回得來，不被卡住或被晚到的 AI 回應拉回對話。
  T.nav++; T.view='home'; T.skill=null; T.roleId=null; T.run=null; T.busy=false;
  document.body.classList.remove('flow-view');   // 總覽頁：顯示標題/IP選單/流程選擇
  const area=$('runnerArea');
  area.innerHTML='<div class="empty">載入中…</div>';
  if(!T.ip){ area.innerHTML='<div class="empty">請先選 IP。</div>'; return; }
  // 個人選的流程（admin 也照個人選擇算）；未選的流程仍在磚牆上顯示但壓暗、不可點。
  const myReps = (await rolesForIp(T.ip)).filter(id=>ROLE_DATA.flowByRep[id]);
  const allReps = ROLE_DATA.flows.map(f=>f.repId);
  const runs = await myRunsForIp(T.ip);
  const rmap={}; runs.forEach(x=>{ rmap[x.skill_id]=x; });
  if(!T.online) showBanner('⚠️ 連不到雲端，進度與對話暫時只存本機，恢復後自動同步。'); else showBanner('');
  const wk=Date.now()-7*864e5;
  // 累積式 + 真實覆蓋率：狀態與完成度都看 AI 評的「流程彙整交付項」覆蓋率，而非自填。
  function covOf(id){ const sk=ROLE_SKILL[id]; const run=sk?rmap[sk+'#'+id]:null;
    const f=ROLE_DATA.flowByRep[id]; const total=f?flowDeliverables(f).length:0;
    const cov=(run&&Array.isArray(run.coverage))?run.coverage:[];
    const covered=cov.filter(c=>c&&c.status==='covered').length;
    const partial=cov.filter(c=>c&&c.status==='partial').length;
    let s='todo'; if(total&&covered>=total) s='done'; else if(covered>0||partial>0||run) s='doing';
    const up=run&&run.updated_at?new Date(run.updated_at):null;
    return { s:s, covered:covered, partial:partial, total:total, wk:!!(up&&up.getTime()>=wk) }; }
  const cmap={}; allReps.forEach(id=>{ cmap[id]=covOf(id); });   // 全部流程都算覆蓋率（壓暗的也要顯示）
  const ids=ROLE_DATA.flows.filter(f=>myReps.includes(f.repId)).map(f=>f.repId);   // 完成度分母＝我參與的流程
  let sumCov=0,sumTot=0,done=0; ids.forEach(id=>{ const c=cmap[id]; sumCov+=c.covered+0.5*c.partial; sumTot+=c.total; if(c.s==='done')done++; });
  const pct=sumTot?Math.round(sumCov/sumTot*100):0;
  const noneJoined=ids.length===0;
  let html='<div class="home"><div class="home-top">'
    +'<div class="pbar-wrap"><div class="pbar-top"><span>我參與的流程　實質完成度（交付項覆蓋率）</span><span><b>'+pct+'%</b>　完成流程 '+done+' / '+ids.length+'</span></div><div class="pbar"><i style="width:'+pct+'%"></i></div></div>'
    + '<button id="digestBtn">📋 本週成果</button>'
    + (T.isAdmin?'<button id="teamBtn">📊 全 IP 進度表</button>':'')
    + '</div>'
    + '<div class="home-hint">這裡同時選流程＋開工：未參與的點「＋ 參與」加入，參與後點磚塊進去跟 AI 顧問一次做完。完成＝在流程裡彙整提案＋貼連結＋狀態設「完成」。</div>'
    + (noneJoined?'<div class="empty" style="margin:8px 0">你在這個 IP 還沒參與任何流程——挑下面想做的點「＋ 參與這個流程」就能開工。</div>':'')
    + '<div id="myTodos"></div><div class="tiles">'
    + allReps.map(id=>{ const f=ROLE_DATA.flowByRep[id]; if(!f) return ''; const c=cmap[id]; const sk=ROLE_SKILL[id];
        const joined=myReps.includes(id);
        const tp=c.total?Math.round((c.covered+0.5*c.partial)/c.total*100):0;
        const chap=f.chapter?('（'+(f.chapter==='story'?'故事章節':'分鏡章節')+'）'):'';
        const stat=joined
          ? '<div class="tstat"><span class="pstat s-'+c.s+'">'+LBL[c.s]+'</span><span style="font-size:11px;color:var(--dim)">'+tp+'%・涵蓋 '+c.covered+'/'+c.total+'</span>'+(c.wk?'<span class="wk">● 本週</span>':'')+'</div>'
          : '<div class="tstat"><span class="pstat s-todo">尚未參與</span></div>';
        const act=joined
          ? '<div class="tile-act"><span class="tile-go">點磚塊進入開工 →</span><button class="t-leave" data-leave="'+id+'">退出</button></div>'
          : '<div class="tile-act"><button class="t-join" data-join="'+id+'">＋ 參與這個流程</button></div>';
        return '<div class="tile'+(joined?' joined':' unjoined')+'" data-id="'+id+'"><div class="rn">'+esc(f.emoji+' '+f.zh)+chap+'</div>'
          +'<div class="rname">'+esc(SKILL_FLOWS[sk].label)+'</div><div class="rscope">'+esc(f.desc)+'</div>'
          +'<div class="tbar"><i style="width:'+(joined?tp:0)+'%"></i></div>'
          + stat + act + '</div>';
      }).join('')
    + '</div>'
    + '<div class="home-foot"><a href="roles.html?u='+esc(memberId()||'')+'&ip='+esc(T.ip)+'">↗ 看每條流程的協作專家與權責（流程細節頁）</a></div>'
    + '<div class="home-gallery" id="homeGallery"></div></div>';
  area.innerHTML=html;
  document.querySelectorAll('.tile.joined').forEach(t=>t.onclick=()=>openRole(+t.dataset.id));
  document.querySelectorAll('[data-join]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); joinFlow(+b.dataset.join); });
  document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); if(confirm('退出後這條流程不再出現在你的開工清單（已產出的內容會保留，重新參與即可繼續）。確定退出？')) leaveFlow(+b.dataset.leave); });
  if($('teamBtn')) $('teamBtn').onclick=()=>renderTeamTable();
  if($('digestBtn')) $('digestBtn').onclick=()=>renderWeeklyDigest();
  fillGallery('homeGallery', true);
  loadMyTodos();
}

// ── C：上次會議回灌給「我」的待辦（勾選 → 標完成）──
async function loadMyTodos(){
  const el=$('myTodos'); if(!el) return;
  const me=memberId(); if(!me){ el.innerHTML=''; return; }
  let rows=[];
  try{ const r=await fetch(SB+'/rest/v1/meeting_todos?owner_member_id=eq.'+encodeURIComponent(me)+'&done=eq.false&select=id,item,due,priority,week&order=created_at.desc',{headers:MXIPAuth.authHeaders()}); if(r.ok) rows=await r.json(); }catch(e){ el.innerHTML=''; return; }
  if(!rows.length){ el.innerHTML=''; return; }
  el.innerHTML='<div class="todos"><div class="todos-h">📋 上次會議給你的待辦（'+rows.length+'）<span class="todos-sub">勾起來＝完成，會記錄起來</span></div>'
    + rows.map(t=>'<label class="todo" data-id="'+esc(t.id)+'"><input type="checkbox">'
        +(t.priority?'<span class="tpri">'+esc(t.priority)+'</span>':'')
        +'<span class="titem">'+esc(t.item)+'</span>'
        +(t.due?'<span class="tdue">'+esc(t.due)+'</span>':'')+'</label>').join('')
    + '</div>';
  el.querySelectorAll('.todo input').forEach(cb=>cb.addEventListener('change', async e=>{
    const lab=e.target.closest('.todo'); const id=lab.getAttribute('data-id');
    e.target.disabled=true; lab.classList.add('todo-doing');
    try{
      const r=await fetch(SB+'/rest/v1/meeting_todos?id=eq.'+encodeURIComponent(id),{method:'PATCH',
        headers:MXIPAuth.authHeaders({Prefer:'return=minimal'}),body:JSON.stringify({done:true,done_at:new Date().toISOString()})});
      if(r.ok){ lab.classList.remove('todo-doing'); lab.classList.add('todo-done'); setTimeout(()=>loadMyTodos(),700); }
      else { e.target.disabled=false; e.target.checked=false; lab.classList.remove('todo-doing'); }
    }catch(_){ e.target.disabled=false; e.target.checked=false; lab.classList.remove('todo-doing'); }
  }));
}

// ── 參考圖（嵌首頁下方 + 對談右欄；以週切換瀏覽，邊看邊協作）──
async function loadGallery(){
  if(T.ipImages && T.ipImages.ip===T.ip) return T.ipImages.items;
  let runs=[];
  try{
    const r=await fetch(SB+'/rest/v1/skill_runs?ip_id=eq.'+encodeURIComponent(T.ip)+'&select=member_id,skill_id,updated_at,responses&order=updated_at.desc&limit=40',{headers:MXIPAuth.authHeaders()});
    if(r.ok) runs=await r.json();
  }catch(e){}
  const items=[];
  runs.forEach(run=>{
    const ch=(run.responses&&run.responses.__chat)||[];
    const rid=(run.skill_id&&run.skill_id.indexOf('#')>=0)?+run.skill_id.split('#')[1]:null;

async function fetchIpRoster(ip){

// 最新一次會議結論裡，這個 IP 的「本週優化命題」：下週重點(focus)/待解問題(issues)/本週進度(progress)+週次。
// 每週會議貼結論寫進 meeting_notes 後，這裡就會讀到最新的 → 新一輪的開場命題自動更新。
async function fetchLatestPremise(ip){
  try{
    const r=await fetch(SB+'/rest/v1/meeting_notes?select=week,meeting_date,summary,ip_updates&order=created_at.desc&limit=1',{headers:MXIPAuth.authHeaders()});
    if(!r.ok) return null;
    const rows=await r.json(); if(!rows.length) return null;
    const n=rows[0]; const ups=Array.isArray(n.ip_updates)?n.ip_updates:[];
    const mine=ups.find(u=>u&&u.ip_id===ip)||null;
    if(!mine) return null;
    return { week:n.week||'', date:n.meeting_date||'', summary:n.summary||'',
             progress:mine.progress||'', issues:mine.issues||'', focus:mine.focus||'' };
  }catch(e){ return null; }
}
// ── 流程路由：記住目前開著的流程，重整後不跳回首頁 ──
// 同時寫網址 hash（可分享/可前進後退）與 localStorage（重整還原的真正依據，
// 不怕 Supabase OAuth/detectSessionInUrl 在載入時清掉網址 hash）。
const OPEN_FLOW_KEY='mxip_runner_open_flow';
function setFlowRoute(roleId){
  try{
    const base=location.pathname+location.search;
    history.replaceState(null,'', roleId==null ? base : base+'#flow='+encodeURIComponent(T.ip)+':'+roleId);
  }catch(e){}
  try{
    if(roleId==null) localStorage.removeItem(OPEN_FLOW_KEY);
    else localStorage.setItem(OPEN_FLOW_KEY, JSON.stringify({ ip:T.ip, roleId:roleId }));
  }catch(e){}
}
function parseFlowRoute(){
  const m=/^#flow=([^:]+):(\d+)$/.exec(location.hash||'');
  return m ? { ip:decodeURIComponent(m[1]), roleId:+m[2] } : null;
}
// 還原目標：優先看網址 hash，沒有再退 localStorage（重整主要靠這個）。
function readOpenFlow(){
  const h=parseFlowRoute(); if(h) return h;
  try{ const o=JSON.parse(localStorage.getItem(OPEN_FLOW_KEY)||'null'); if(o&&o.ip&&o.roleId) return { ip:o.ip, roleId:+o.roleId }; }catch(e){}
  return null;
}
// 這次載入是不是「瀏覽器重整」？只有重整才還原上次流程；正常進入/從別頁切回 → 顯示總覽頁。
function isReloadNav(){
  try{
    const nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation'))||[];
    if(nav.length&&nav[0].type) return nav[0].type==='reload';
    return !!(performance.navigation&&performance.navigation.type===1);
  }catch(e){ return false; }
}
async function openRole(id){
  if(T.busy) return;
  const myNav=++T.nav;   // 這次開啟的序號；期間使用者若離開/切換，後面的 await 回來就放棄。
  T.roleId=id; T.skill=ROLE_SKILL[id]; T.view='chat';
  setFlowRoute(id);   // 寫進網址 hash，瀏覽器重整後仍停在這條流程
  // 帶入既有角色名冊（背景）＋最新會議命題（本週優化方向）：開場先講背景與本週要優化什麼。
  const [rost, prem] = await Promise.all([fetchIpRoster(T.ip), fetchLatestPremise(T.ip)]);
  if(T.nav!==myNav) return;   // 已離開 → 放棄這次開啟
  T.roster=rost; T.premise=prem;
  await loadRun();
  if(T.nav!==myNav) return;
  if(shouldUpgradeKickoff()){
    // 還沒動過的對談：清掉舊開場，用含背景＋本週命題的新開場重生。
    T.run.responses.__chat=[]; await startIfEmpty();
  } else {
    // 已有進度的對談：不重生開場，但若有新一週會議結論就插入「新一週優化開始」訊息。
    await startIfEmpty(); await maybeInjectNewWeek();
  }
}

function runKey(){ return T.skill + (T.roleId ? '#'+T.roleId : ''); }
function lsKey(){ return 'mxip_chat_'+memberId()+'_'+T.ip+'_'+runKey(); }
function blankRun(){ return { member_id:memberId(), ip_id:T.ip, skill_id:runKey(), responses:{__chat:[]}, current_stage:0, status:'draft' }; }
function chat(){ return (T.run && T.run.responses && T.run.responses.__chat) || []; }
async function loadRun(){
  T.run=null; let loaded=false;
  try{
    const url=SB+'/rest/v1/skill_runs?member_id=eq.'+encodeURIComponent(memberId())+'&ip_id=eq.'+encodeURIComponent(T.ip)+'&skill_id=eq.'+encodeURIComponent(runKey())+'&select=*';

    if(r.ok){ T.online=true; const rows=await r.json(); if(rows.length){ T.run=rows[0]; loaded=true; } } else T.online=false;
  }catch(e){ T.online=false; }
  if(!loaded){ try{ const raw=localStorage.getItem(lsKey()); if(raw){ T.run=JSON.parse(raw); loaded=true; } }catch(e){} }

async function saveRun(){

  }catch(e){ T.online=false; markSaved('已存本機'); }

// 交件通知（單向推 Slack 戰報；fire-and-forget，不阻塞 UI）
async function notifyDone(){
  try{
    const role=curName()||((SKILL_FLOWS[T.skill]||{}).label||T.skill);
    const items=curDeliverables(); const cov=(T.run&&T.run.responses&&T.run.responses.__coverage)||[];
    const covered=items.filter((d,i)=>cov[i]&&cov[i].status==='covered').length;
    const pct=items.length?Math.round(covered/items.length*100):100;
    await fetch(CONSULT_URL,{ method:'POST', headers:MXIPAuth.authHeaders(),
      body:JSON.stringify({ action:'notify', event:'role_done', member:memberId(), ipName:ipName(T.ip), roleName:role, pct:pct }) });
  }catch(e){}
}
async function callConsult(){
  const arr=chat();
  const msgs=arr.map(m=>({ role:m.role, content:m.content }));
  const last=arr[arr.length-1];
  const images=(last&&last.role==='user'&&Array.isArray(last.images))?last.images.map(toPayload).filter(Boolean):[];
  const docs=Array.isArray(T.lastDocs)?T.lastDocs.map(d=>({name:d.name,data:d.data})):[]; T.lastDocs=null;
  const r=await fetch(CONSULT_URL,{ method:'POST', headers:MXIPAuth.authHeaders(), body:JSON.stringify({ skillBrief:buildBrief(), flowFocus:buildFlowFocus(), roleFocus:buildRoleFocus(), roster:T.roster, messages:msgs, images:images, docs:docs }) });
  let data={}; try{ data=await r.json(); }catch(e){}
  if(!r.ok || data.error){ const d=data.error||('HTTP '+r.status); throw new Error(typeof d==='string'?d:JSON.stringify(d)); }
  return { text:(data.text||'').trim()||'（顧問沒有回覆內容，請再試一次）', coverage:(Array.isArray(data.coverage)?data.coverage:null), roster:(Array.isArray(data.roster)?data.roster:null) };
}

function scrollMsgs(){ const m=$('msgs'); if(m){ m.scrollTop=m.scrollHeight; const c=m.closest('.chat'); if(c) c.scrollTop=c.scrollHeight; } }   // 桌機 .msgs 內捲；手機改 .chat 整體捲動，兩邊都拉到底
function wire(){
  if($('backBtn')) $('backBtn').onclick=()=>{ setFlowRoute(null); renderHome(); };   // 永遠可回（renderHome 會作廢在途請求、解除 busy）
  if($('fileInput')) $('fileInput').onchange=(e)=>{ addFiles(e.target.files); e.target.value=''; };
  if($('docBtn')) $('docBtn').onclick=async ()=>{
    const u=(prompt('貼上 Google Doc / Drive 連結，把裡面的文字讀進來當素材：')||'').trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u) && !/^[a-zA-Z0-9_-]{20,}$/.test(u)){ alert('請貼有效的 Google Doc / Drive 連結'); return; }
    const inp=$('input'); const old=inp?inp.placeholder:''; const btn=$('docBtn');
    if(btn) btn.textContent='⏳'; if(inp){ inp.disabled=true; inp.placeholder='從 Google Drive 讀取中…'; }
    try{
      const res=await fetch(DRIVE_URL,{method:'POST',headers:MXIPAuth.authHeaders(),body:JSON.stringify({url:u})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok){ alert('讀取失敗：'+(d.error||res.status)); }
      else if(inp){ const t=(d.title?'【'+d.title+'】\n':'')+(d.text||''); inp.value=inp.value?(inp.value+'\n\n'+t):t; }
    }catch(e){ alert('讀取失敗：'+e.message); }
    if(btn) btn.textContent='📄'; if(inp){ inp.disabled=false; inp.placeholder=old; inp.focus(); }
  };
  document.querySelectorAll('[data-rm]').forEach(b=>{ b.onclick=()=>{ T.pending.splice(+b.dataset.rm,1); renderChat(); }; });
  document.querySelectorAll('[data-rmd]').forEach(b=>{ b.onclick=()=>{ T.pendingDocs.splice(+b.dataset.rmd,1); renderChat(); }; });
  if($('addLinkBtn')) $('addLinkBtn').onclick=()=>{
    const u=(prompt('貼上提案連結（ChatGPT / Gemini / Google Doc / Figma / Drive…）：')||'').trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)){ alert('請貼有效網址（http/https 開頭）'); return; }
    if(!T.run.responses.__links) T.run.responses.__links=[];
    T.run.responses.__links.push(u); saveRun(); renderChat();
  };
  document.querySelectorAll('[data-rml]').forEach(b=>{ b.onclick=()=>{ if(T.run.responses.__links){ T.run.responses.__links.splice(+b.dataset.rml,1); saveRun(); renderChat(); } }; });
  document.querySelectorAll('[data-copyp]').forEach(b=>{ b.onclick=()=>{ const p=promptList()[+b.dataset.copyp]; if(p&&p.prompt){ try{ navigator.clipboard.writeText(p.prompt); b.textContent='已複製✓'; setTimeout(()=>{b.textContent='複製';},1200); }catch(e){ alert('複製失敗，請手動選取'); } } }; });
  document.querySelectorAll('.bimgs img').forEach(img=>{ img.onclick=()=>openLightbox(img.src); });
  const input=$('input');
  if($('sendBtn')) $('sendBtn').onclick=()=>doSend();
  if(input){ input.onkeydown=(e)=>{
    // 中文輸入法組字中按 Enter 是「選字確認」，不能當送出（否則組字被吃掉、內容消失、又送出空字串）。
    // e.isComposing（標準）／keyCode 229（舊版瀏覽器 fallback）都代表 IME 組字中。
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); doSend(); }
  };
    // 桌機自動聚焦輸入框；手機不自動聚焦（避免每次重繪都彈出軟鍵盤）。
    if(!('ontouchstart' in window) && !navigator.maxTouchPoints){ input.focus(); }
  }
  if($('deliverBtn')) $('deliverBtn').onclick=()=>doSend(deliverInstr(), true);
  if($('exportMd')) $('exportMd').onclick=exportMarkdown;
  if($('restartBtn')) $('restartBtn').onclick=restart;
  if($('statusSel')) $('statusSel').onchange=(e)=>{ const prev=T.run.status; T.run.status=e.target.value; saveRun(); if(e.target.value==='done'&&prev!=='done') notifyDone(); };
  // 手機「＋」功能選單：展開/收合，選單項目直接代理點擊上面那些（隱藏的）按鈕，不重複邏輯。
  if($('moreBtn')) $('moreBtn').onclick=()=>{ const s=$('msheet'); if(s) s.hidden=!s.hidden; };
  const _proxy=(id,target)=>{ const b=$(id); if(b) b.onclick=()=>{ const t=$(target); const s=$('msheet'); if(s) s.hidden=true; if(t) t.click(); }; };
  _proxy('m_file','fileInput'); _proxy('m_doc','docBtn'); _proxy('m_deliver','deliverBtn'); _proxy('m_export','exportMd'); _proxy('m_restart','restartBtn');
  if($('m_status')) $('m_status').onchange=(e)=>{ const ss=$('statusSel'); const s=$('msheet'); if(s) s.hidden=true; if(ss){ ss.value=e.target.value; ss.onchange({target:ss}); } };
}
// 依「這條流程彙整的交付清單」結構化彙整指令 → 全公司提案格式統一
function deliverInstr(){
  const items=curDeliverables();
  const spec = items.length
    ? '\n\n請**嚴格依這條流程的交付清單逐項組織**（每一項用一個 `## 小標題`，內容寫該項的具體產出；尚未完成的標「（待補）」），讓所有人的提案格式一致：\n- '+items.join('\n- ')
    : '';
  const promptAsk = '\n\n若這條流程的產出**需要 AI 生圖**（角色設定圖、分鏡畫面、視覺稿等），請在 deliverable 之後**另起一行 `===PROMPTS===`**，接一個 JSON 陣列，每個生圖需求一筆：{"tool":"gemini" 或 "gpt-image","use":"用途/這張要畫什麼","prompt":"完整、可直接貼去生圖的 prompt（英文佳）","negative":"防漂移/負面控制"}。**同一個畫面若 Gemini 與 ChatGPT 都適用，就各出一筆**，讓成員自己選要用哪版。沒有生圖需求就完全不要這段。';
  return '請把我這條流程目前累積的成果，彙整成一份「正式提案」deliverable：乾淨、可直接交付的 Markdown，開頭一行標題寫「'+curName()+' · '+ipName(T.ip)+'」。'+spec+promptAsk;
}
async function doSend(forced, asDeliverable){
  if(T.busy) return;
  const input=$('input'); const text=forced||(input?input.value.trim():'');
  const imgs=T.pending.slice(); const docs=T.pendingDocs.slice();
  if(!text && !imgs.length && !docs.length) return;
  T.lastDocs=docs;
  const myNav=T.nav;
  chat().push({ role:'user', content:(asDeliverable?'（請依 skill 規格彙整成正式提案）':(text||'（請看我上傳的附件）')), images:imgs, docNames:docs.map(d=>d.name), ts:Date.now() }); if(imgs.length) T.ipImages=null; T.pending=[]; T.pendingDocs=[]; T.busy=true; renderChat(); saveRun();
  try{ const res=await callConsult(); if(T.nav!==myNav) return;
    let atxt=res.text, prompts=null;
    if(asDeliverable){
      const pi=atxt.indexOf('===PROMPTS===');
      if(pi>=0){ const after=atxt.slice(pi+13); atxt=atxt.slice(0,pi).trim();
        try{ const mm=after.match(/\[[\s\S]*\]/); if(mm) prompts=JSON.parse(mm[0]); }catch(_e){} }
      T.run.responses.__deliverable={ text:atxt, at:new Date().toISOString(), by:memberId() };
      if(Array.isArray(prompts)&&prompts.length) T.run.responses.__prompts=prompts; else if(pi>=0) T.run.responses.__prompts=[];
    }
    chat().push({ role:'assistant', content:atxt, deliverable:!!asDeliverable });
    if(res.coverage) T.run.responses.__coverage=res.coverage; if(res.roster && T.skill==='brand-core') T.run.responses.__roster=res.roster; }
  catch(e){ if(T.nav!==myNav) return; chat().push({ role:'assistant', content:'⚠️ 顧問暫時連不上：'+e.message+'\n\n（可先重試；若持續，通知管理者。）' }); }
  if(T.nav!==myNav) return;
  T.busy=false; renderChat(); saveRun();
}
// 既有角色名冊 → 開場背景文字（A/B/C…＋一句描述）。沒有 roster 就回空字串。
function rosterSummaryText(){
  const r=T.roster;
  if(!Array.isArray(r)||!r.length) return '';
  const lines=r.map((c,i)=>String.fromCharCode(65+i)+'. '+(c.name||('角色'+(i+1)))+(c.dna?('：'+c.dna):''));
  return '【這個 IP 目前已建立的角色（共 '+r.length+' 位）】\n'+lines.join('\n');
}
// 最新會議命題 → 開場文字（上週結論＋本週要優化什麼）。沒有命題就回空字串。
function premiseSummaryText(){
  const p=T.premise;
  if(!p||(!p.focus&&!p.issues)) return '';
  let s='【上次會議（'+(p.week||'最近')+'）對這個 IP 的結論與本週方向】\n';
  if(p.progress) s+='・本週進度：'+p.progress+'\n';
  if(p.issues)   s+='・待解問題：'+p.issues+'\n';
  if(p.focus)    s+='・這一輪要優化的重點：'+p.focus+'\n';
  return s.trim();
}
function currentPremiseWeek(){ return (T.premise&&T.premise.week)||''; }
// 這條對談是否已有實質進度（有使用者回覆或覆蓋率）→ 有進度就不重生開場、改用插入新一週訊息。
function hasProgress(){
  const userMsgs=chat().filter(m=>!m.kickoff&&!m.newweek&&m.role==='user').length;
  const cov=(T.run&&T.run.responses&&T.run.responses.__coverage)||[];
  const prog=Array.isArray(cov)?cov.filter(c=>c&&(c.status==='covered'||c.status==='partial')).length:0;
  return userMsgs>0||prog>0;
}
// 開場 kickoff：先講本週命題（上週結論→這週優化什麼）＋既有角色背景，再問第一題。
function buildKickoff(){
  const rs=rosterSummaryText(), ps=premiseSummaryText();
  if(!rs&&!ps) return KICKOFF;   // 沒有任何背景/命題就維持原本開場
  let bg='在開始引導前，先讓參與者知道這一輪的命題與目前進度：\n\n';
  if(ps) bg+=ps+'\n\n';
  if(rs) bg+=rs+'\n\n';
  let inst='請你（顧問）開場時：';
  if(ps) inst+='①先用 1–2 句點出「上週結論 → 這一輪要優化什麼」，讓大家知道本週命題；';
  if(rs) inst+='②用 2–4 句摘要既有角色與目前進度——不要假裝從零開始、不要再問「這個角色叫什麼」這種已知的事；';
  inst+='③告訴參與者「既有素材在右側『既有素材庫』、完整設定在『品牌核心』正式提案」，並說明可以怎麼幫忙給意見；④再依這條流程的職責問第一個、最該先決定的問題（一次只問一件事）。';
  return bg+inst;
}
async function startIfEmpty(){
  if(chat().length>0){ renderChat(); return; }
  const myNav=T.nav;
  chat().push({ role:'user', content:buildKickoff(), kickoff:true }); T.busy=true; renderChat(); saveRun();
  try{ const res=await callConsult(); if(T.nav!==myNav) return; chat().push({ role:'assistant', content:res.text }); if(res.coverage) T.run.responses.__coverage=res.coverage; if(res.roster && T.skill==='brand-core') T.run.responses.__roster=res.roster; T.run.responses.__kickoffV=KICKOFF_VERSION; T.run.responses.__premiseWeek=currentPremiseWeek(); }
  catch(e){ if(T.nav!==myNav) return; chat().push({ role:'assistant', content:'⚠️ 顧問暫時連不上：'+e.message+'\n\n（後端可能尚未部署完成，稍後按「↻ 重新開始」再試。）' }); }
  if(T.nav!==myNav) return;
  T.busy=false; renderChat(); saveRun();
}
// 舊存檔的開場要不要自動升級成「含背景／本週命題」的新開場？
// 條件：還沒實質進度 + 這個 IP 有背景/命題可加 + （開場版本舊 或 命題已換新一週）。
// 已經談到一半的對談一律不動（改走 maybeInjectNewWeek），避免洗掉進度。
function shouldUpgradeKickoff(){
  if(!T.run||!T.run.responses) return false;
  if(hasProgress()) return false;
  const hasBG = !!rosterSummaryText() || !!premiseSummaryText();
  if(!hasBG) return false;
  const verOld = (T.run.responses.__kickoffV||0) < KICKOFF_VERSION;
  const wkNew  = !!currentPremiseWeek() && (T.run.responses.__premiseWeek||'') !== currentPremiseWeek();
  return verOld || wkNew;
}
// 已有進度的對談遇到「新一週會議結論」：插入一條「新一週優化開始」訊息（保留先前進度，每週只插一次）。
async function maybeInjectNewWeek(){
  if(!T.run||!T.run.responses) return false;
  const wk=currentPremiseWeek();
  if(!wk||!T.premise||(!T.premise.focus&&!T.premise.issues)) return false;
  if((T.run.responses.__premiseWeek||'')===wk) return false;   // 已是這週命題
  if(!hasProgress()){ T.run.responses.__premiseWeek=wk; saveRun(); return false; }  // 沒進度的交給開場重生
  let body='—— 新一週優化開始（'+wk+'）——\n';
  if(T.premise.focus) body+='本週要優化：'+T.premise.focus+'\n';
  if(T.premise.issues) body+='待解問題：'+T.premise.issues+'\n';
  body+='我們從上週的成果接著往這些方向優化。';
  chat().push({ role:'assistant', content:body, newweek:true });
  T.run.responses.__premiseWeek=wk; saveRun(); renderChat();
  return true;
}
function restart(){ if(!confirm('重新開始會清空這條流程的對話，確定？')) return; T.run.responses.__chat=[]; saveRun(); startIfEmpty(); }
function restart(){ if(!confirm('重新開始會清空這條流程的對話，確定？')) return; T.run.responses.__chat=[]; saveRun(); startIfEmpty(); }

// ── 匯出 ──
function buildMarkdown(){
  const f=SKILL_FLOWS[T.skill]; const who=curName()||f.label;
  let md='# '+who+' — '+ipName(T.ip)+'\n\n> 成員：'+memberId()+'　·　流程：'+f.label+'　·　'+new Date().toLocaleString('zh-TW')+'\n\n';
  chat().filter(m=>!m.kickoff).forEach(m=>{ md+=(m.role==='assistant'?'**AI 顧問**：\n':'**你**：\n')+m.content+'\n\n---\n\n'; });
  return md;
}
function download(name,text,mime){ const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
function exportMarkdown(){ download((runKey()+'_'+T.ip+'_'+memberId()).replace(/[^\w\-]/g,'-')+'.md', buildMarkdown(),'text/markdown;charset=utf-8'); }

// ── 啟動 ──
async function onIpChange(){ T.ip=$('ipSel').value; setFlowRoute(null); await renderHome(); }
async function boot(){
  await MXIPAuth.init({ gate:'overlay' });   // 未登入：原地壓暗 + 置中登入卡（登入後 OAuth 整頁重載再 boot）
  if(!(MXIPAuth.currentUser() && MXIPAuth.isAllowed())) return;
  try{ T.isAdmin = await MXIPAuth.hasAnyRole(['admin']); }catch(e){ T.isAdmin=false; }
  await loadIPs();            // 動態 IP 清單（含新增/暫停；暫停 IP 仍可選來充實內容）
  fillIpSelect();
  // 從流程選擇頁帶 ?ip= 深連結進來時，預選該 IP（值不存在就退回第一個）。
  const _qip=new URLSearchParams(location.search).get('ip');
  if(_qip && Array.from($('ipSel').options).some(o=>o.value===_qip)) $('ipSel').value=_qip;
  T.ip=$('ipSel').value;
  $('ipSel').onchange=onIpChange;
  if($('lightbox')) $('lightbox').onclick=()=>$('lightbox').classList.remove('on');
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const l=$('lightbox'); if(l) l.classList.remove('on'); } });
  // 只有「瀏覽器重整」才還原上次流程；正常進入或從別頁切回 → 顯示總覽頁，並清掉上次流程記憶
  // （否則每次進 Skill Runner 都被丟進上次那條流程、回不到總覽）。
  const _reload=isReloadNav();
  if(!_reload) setFlowRoute(null);
  const _route = _reload ? readOpenFlow() : null;
  if(_route && ROLE_DATA.flowByRep[_route.roleId] && Array.from($('ipSel').options).some(o=>o.value===_route.ip)){
    if($('ipSel').value!==_route.ip){ $('ipSel').value=_route.ip; T.ip=_route.ip; }
    $('runnerArea').innerHTML='<div class="empty">載入中…</div>';
    await openRole(_route.roleId);
  } else {
    await renderHome();
  }
  MXIPAuth.onChange(s=>{ if(!(s&&s.user)) $('runnerArea').innerHTML='<div class="empty">已登出。</div>'; });
}
boot().catch(e=>{ console.error(e); $('runnerArea').innerHTML='<div class="empty">載入失敗：'+esc(e.message||e)+'</div>'; });
